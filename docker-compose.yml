services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./outputs/gguf:/models:ro
    environment:
      LLAMA_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
    command:
      - --model
      - /models/test-model.gguf
      - --alias
      - test-model
      - --jinja
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
