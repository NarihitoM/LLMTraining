name: Deploy

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  REPOSITORY: llm
  SERVICE: test-model

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY secret not set, skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      BUCKET: ${{ secrets.GCS_BUCKET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Require API key
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY secret not set, refusing to deploy a public model without an API key" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Build and push image
        run: |
          repo="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/$SERVICE"
          image="$repo:${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER"
          echo "REPO=$repo" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

          gcloud artifacts repositories describe "$REPOSITORY" --location "$REGION" >/dev/null 2>&1 \
            || gcloud artifacts repositories create "$REPOSITORY" --location "$REGION" --repository-format docker
          gcloud storage cp "gs://$BUCKET/test-model.gguf" deploy/
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$image" deploy
          docker push "$image"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --cpu 4 \
            --memory 8Gi \
            --concurrency 4 \
            --max-instances 1 \
            --timeout 600 \
            --cpu-boost \
            --allow-unauthenticated \
            --set-env-vars "LLAMA_API_KEY=$LLM_API_KEY" \
            --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          echo "Live: $url/v1/chat/completions (model: test-model)"

      - name: Delete old images
        run: |
          current=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          gcloud artifacts docker images list "$REPO" --format 'value(version)' \
            | { grep -vx "$current" || true; } \
            | while read -r digest; do
                gcloud artifacts docker images delete "$REPO@$digest" --delete-tags --quiet
              done
